name: CI Foundation

on:
  push:
    branches:
      - main
      - 'phase-1/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: final_web_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, openssl
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Configure testing environment
        working-directory: backend
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: Check code formatting with Pint
        working-directory: backend
        run: php vendor/bin/pint --test

      - name: Run PHPUnit test suite
        working-directory: backend
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: final_web_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test

  frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Run code linter
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript check and production build
        working-directory: frontend
        run: npm run build

      - name: Run Vitest unit & component tests
        working-directory: frontend
        run: npm run test:run

  e2e:
    name: Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: final_web_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, openssl
          tools: composer:v2

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Configure backend testing environment for E2E
        working-directory: backend
        run: |
          cp .env.testing.example .env
          php artisan key:generate

      - name: Configure frontend environment & Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke tests
        working-directory: frontend
        run: npx playwright test
