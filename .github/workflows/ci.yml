name: CI Foundation

on:
  push:
    branches:
      - main
      - 'phase-*/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: final_web_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, openssl
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Configure testing environment
        working-directory: backend
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing

      - name: Normalize MySQL test database collation
        run: |
          if ! command -v mysql &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi
          mysql -h 127.0.0.1 -P 3306 -u root -e "ALTER DATABASE final_web_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Verify MySQL database collation contract
        run: |
          RESULT=$(mysql -h 127.0.0.1 -P 3306 -u root -N -s -e "SELECT CONCAT(DEFAULT_CHARACTER_SET_NAME, ':', DEFAULT_COLLATION_NAME) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = 'final_web_test';")
          echo "Database charset and collation: $RESULT"
          if [ "$RESULT" != "utf8mb4:utf8mb4_unicode_ci" ]; then
            echo "Error: Database collation mismatch. Expected utf8mb4:utf8mb4_unicode_ci, got $RESULT"
            exit 1
          fi

      - name: Validate composer.json
        working-directory: backend
        run: composer validate --strict

      - name: Check code formatting with Pint
        working-directory: backend
        run: php vendor/bin/pint --test

      - name: Run PHPUnit test suite
        working-directory: backend
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: final_web_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan test

  frontend:
    name: Frontend Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Run code linter
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript check and production build
        working-directory: frontend
        run: npm run build

      - name: Run Vitest unit & component tests
        working-directory: frontend
        run: npm run test:run

  e2e:
    name: Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: final_web_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, openssl
          tools: composer:v2

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Configure backend testing environment for E2E
        working-directory: backend
        run: |
          cp .env.testing.example .env
          php artisan key:generate

      - name: Normalize MySQL test database collation
        run: |
          if ! command -v mysql &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi
          mysql -h 127.0.0.1 -P 3306 -u root -e "ALTER DATABASE final_web_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Verify MySQL database collation contract
        run: |
          RESULT=$(mysql -h 127.0.0.1 -P 3306 -u root -N -s -e "SELECT CONCAT(DEFAULT_CHARACTER_SET_NAME, ':', DEFAULT_COLLATION_NAME) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = 'final_web_test';")
          echo "Database charset and collation: $RESULT"
          if [ "$RESULT" != "utf8mb4:utf8mb4_unicode_ci" ]; then
            echo "Error: Database collation mismatch. Expected utf8mb4:utf8mb4_unicode_ci, got $RESULT"
            exit 1
          fi

      - name: Run database migrations for E2E
        working-directory: backend
        run: php artisan migrate --force

      - name: Configure frontend environment & Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E smoke tests
        working-directory: frontend
        run: npx playwright test

  docker-runtime:
    name: Docker Runtime Reproducibility
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker and Compose versions
        run: |
          docker version
          docker compose version

      - name: Generate ephemeral Docker environment
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          MYSQL_ROOT_PASSWORD="$(openssl rand -hex 16)"
          DB_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$MYSQL_ROOT_PASSWORD"
          echo "::add-mask::$DB_PASSWORD"
          printf 'APP_KEY=%s\nMYSQL_ROOT_PASSWORD=%s\nDB_USERNAME=final_web_user\nDB_PASSWORD=%s\nVITE_API_BASE_URL=http://127.0.0.1:8000\n' \
            "$APP_KEY" "$MYSQL_ROOT_PASSWORD" "$DB_PASSWORD" > .env.docker

      - name: Verify Compose configuration without rendering secrets
        run: docker compose --env-file .env.docker config --quiet

      - name: Build all images (clean, no cache)
        run: docker compose --env-file .env.docker build --no-cache

      - name: Start Docker Compose stack
        id: compose-up
        continue-on-error: true
        run: docker compose --env-file .env.docker up -d

      - name: Diagnose Docker startup
        run: |
          echo "=== All Container Statuses ==="
          docker compose --env-file .env.docker ps -a
          echo "=== MySQL Container Logs ==="
          docker compose --env-file .env.docker logs --no-color mysql
          echo "=== Backend Container Logs ==="
          docker compose --env-file .env.docker logs --no-color backend
          echo "=== Backend State & Health Details ==="
          if docker inspect final-web-backend >/dev/null 2>&1; then
            echo "State.Status: $(docker inspect final-web-backend --format='{{.State.Status}}')"
            echo "State.Running: $(docker inspect final-web-backend --format='{{.State.Running}}')"
            echo "State.ExitCode: $(docker inspect final-web-backend --format='{{.State.ExitCode}}')"
            echo "State.Error: $(docker inspect final-web-backend --format='{{.State.Error}}')"
            echo "Health.Status: $(docker inspect final-web-backend --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}')"
            echo "Health.FailingStreak: $(docker inspect final-web-backend --format='{{if .State.Health}}{{.State.Health.FailingStreak}}{{else}}none{{end}}')"
            echo "Health.Log:"
            docker inspect final-web-backend --format='{{if .State.Health}}{{range .State.Health.Log}}ExitCode: {{.ExitCode}}, Output: {{.Output}}{{end}}{{else}}none{{end}}'
          else
            echo "final-web-backend container does not exist."
          fi

      - name: Enforce Docker Compose startup success
        if: steps.compose-up.outcome != 'success'
        run: |
          echo "ERROR: Docker Compose startup failed. Diagnostic details captured above."
          exit 1

      - name: Wait for all services to become healthy
        run: |
          echo "Waiting for all containers to reach healthy status..."
          for i in $(seq 1 60); do
            MYSQL_STATUS=$(docker inspect --format='{{.State.Health.Status}}' final-web-mysql 2>/dev/null || echo "missing")
            BACKEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' final-web-backend 2>/dev/null || echo "missing")
            FRONTEND_STATUS=$(docker inspect --format='{{.State.Health.Status}}' final-web-frontend 2>/dev/null || echo "missing")
            echo "[$i/60] mysql=$MYSQL_STATUS backend=$BACKEND_STATUS frontend=$FRONTEND_STATUS"
            if [ "$MYSQL_STATUS" = "healthy" ] && [ "$BACKEND_STATUS" = "healthy" ] && [ "$FRONTEND_STATUS" = "healthy" ]; then
              echo "All services healthy."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timeout: not all services reached healthy within 300s"
              docker compose --env-file .env.docker ps
              docker compose --env-file .env.docker logs
              exit 1
            fi
            sleep 5
          done

      - name: Inspect container health status
        run: docker compose --env-file .env.docker ps

      - name: Verify frontend HTTP 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5173/)
          echo "Frontend HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "FAIL: Expected 200, got $STATUS" && exit 1)

      - name: Verify backend health HTTP 200
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:8000/api/health)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health)
          echo "Backend health HTTP status: $STATUS"
          echo "Backend health response: $RESPONSE"
          [ "$STATUS" = "200" ] || (echo "FAIL: Expected 200, got $STATUS" && exit 1)

      - name: Verify database health HTTP 200
        run: |
          RESPONSE=$(curl -s http://127.0.0.1:8000/api/health/database)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health/database)
          echo "Database health HTTP status: $STATUS"
          echo "Database health response: $RESPONSE"
          [ "$STATUS" = "200" ] || (echo "FAIL: Expected 200, got $STATUS" && exit 1)

      - name: Verify MySQL database contract inside container
        run: |
          RESULT=$(docker compose --env-file .env.docker exec -T mysql \
            mysql -u root -p"$(grep MYSQL_ROOT_PASSWORD .env.docker | cut -d= -f2)" \
            -N -s -e "SELECT CONCAT(DEFAULT_CHARACTER_SET_NAME, ':', DEFAULT_COLLATION_NAME) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = 'final_web';")
          echo "MySQL charset:collation = $RESULT"
          [ "$RESULT" = "utf8mb4:utf8mb4_unicode_ci" ] || (echo "FAIL: unexpected collation $RESULT" && exit 1)

      - name: Verify Phase 3 database schema contract in final_web
        run: |
          USERS_COUNT=$(docker compose --env-file .env.docker exec -T mysql \
            mysql -u root -p"$(grep MYSQL_ROOT_PASSWORD .env.docker | cut -d= -f2)" \
            -N -s -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='final_web' AND TABLE_NAME = 'users';")
          echo "Users table count: $USERS_COUNT"
          [ "$USERS_COUNT" = "1" ] || (echo "FAIL: users table missing" && exit 1)

          RESET_TOKENS_COUNT=$(docker compose --env-file .env.docker exec -T mysql \
            mysql -u root -p"$(grep MYSQL_ROOT_PASSWORD .env.docker | cut -d= -f2)" \
            -N -s -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='final_web' AND TABLE_NAME = 'password_reset_tokens';")
          echo "Password reset tokens table count: $RESET_TOKENS_COUNT"
          [ "$RESET_TOKENS_COUNT" = "1" ] || (echo "FAIL: password_reset_tokens table missing" && exit 1)

          PREFERENCES_COUNT=$(docker compose --env-file .env.docker exec -T mysql \
            mysql -u root -p"$(grep MYSQL_ROOT_PASSWORD .env.docker | cut -d= -f2)" \
            -N -s -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='final_web' AND TABLE_NAME = 'user_preferences';")
          echo "User preferences table count: $PREFERENCES_COUNT"
          [ "$PREFERENCES_COUNT" = "1" ] || (echo "FAIL: user_preferences table missing" && exit 1)

          AVATAR_COL_COUNT=$(docker compose --env-file .env.docker exec -T mysql \
            mysql -u root -p"$(grep MYSQL_ROOT_PASSWORD .env.docker | cut -d= -f2)" \
            -N -s -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='final_web' AND TABLE_NAME = 'users' AND COLUMN_NAME = 'avatar_path';")
          echo "Users avatar_path column count: $AVATAR_COL_COUNT"
          [ "$AVATAR_COL_COUNT" = "1" ] || (echo "FAIL: avatar_path column missing in users table" && exit 1)

          NOTES_COUNT=$(docker compose --env-file .env.docker exec -T mysql \
            mysql -u root -p"$(grep MYSQL_ROOT_PASSWORD .env.docker | cut -d= -f2)" \
            -N -s -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='final_web' AND TABLE_NAME = 'notes';")
          echo "Notes table count: $NOTES_COUNT"
          [ "$NOTES_COUNT" = "1" ] || (echo "FAIL: notes table missing" && exit 1)

          UNEXPECTED=$(docker compose --env-file .env.docker exec -T mysql \
            mysql -u root -p"$(grep MYSQL_ROOT_PASSWORD .env.docker | cut -d= -f2)" \
            -N -s -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='final_web' AND TABLE_NAME IN ('labels', 'note_label', 'attachments', 'note_shares', 'personal_access_tokens');")
          echo "Unexpected future tables count: $UNEXPECTED"
          [ "$UNEXPECTED" = "0" ] || (echo "FAIL: unexpected future tables found" && exit 1)

      - name: Verify host-independence — backend DB_HOST=mysql
        run: |
          DB_HOST=$(docker inspect final-web-backend --format='{{range .Config.Env}}{{println .}}{{end}}' | grep '^DB_HOST=' | cut -d= -f2)
          echo "backend DB_HOST=$DB_HOST"
          [ "$DB_HOST" = "mysql" ] || (echo "FAIL: DB_HOST not 'mysql'" && exit 1)

      - name: Verify MySQL has no host port binding
        run: |
          HOST_PORT=$(docker inspect final-web-mysql --format='{{json .NetworkSettings.Ports}}')
          echo "MySQL port bindings: $HOST_PORT"
          echo "$HOST_PORT" | grep -q '"3306/tcp":\[' && echo "FAIL: 3306 is host-bound" && exit 1
          echo "PASS: MySQL 3306 is not bound to host"

      - name: Set up Node.js 24 for Playwright Docker proof
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies and Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright smoke test against Docker stack
        working-directory: frontend
        env:
          CI: ''
        run: npx playwright test

      - name: Cleanup — tear down Docker Compose stack and volumes
        if: always()
        run: |
          docker compose --env-file .env.docker down -v --remove-orphans
          rm -f .env.docker

      - name: Verify all project containers removed
        if: always()
        run: |
          REMAINING=$(docker ps -a --filter "name=final-web" --format "{{.Names}}")
          if [ -n "$REMAINING" ]; then
            echo "FAIL: containers still present: $REMAINING"
            exit 1
          fi
          echo "PASS: no project containers remaining"
